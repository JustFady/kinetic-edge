<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kinetic-Edge Basketball Referee Assistant — AI-powered video analysis for real-time referee support">
    <title>Kinetic-Edge | Referee Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Top Stats Bar -->
    <header id="stats-bar">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <div>
                <h1>KINETIC-EDGE</h1>
                <span class="subtitle">Referee Assistant</span>
            </div>
        </div>
        <div class="stats">
            <div class="stat" id="stat-fps">
                <span class="stat-value">0</span>
                <span class="stat-label">FPS</span>
            </div>
            <div class="stat" id="stat-players">
                <span class="stat-value">0</span>
                <span class="stat-label">Players</span>
            </div>
            <div class="stat" id="stat-alerts">
                <span class="stat-value">0</span>
                <span class="stat-label">Alerts</span>
            </div>
            <div class="stat" id="stat-frames">
                <span class="stat-value">0 / 0</span>
                <span class="stat-label">Frames</span>
            </div>
        </div>
        <div class="status-badge" id="status-badge">
            <span class="status-dot"></span>
            <span class="status-text">Ready</span>
        </div>
    </header>

    <main>
        <!-- Video Feed Area -->
        <section id="video-section">
            <!-- Drop Zone (shown when no video is loaded) -->
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <div class="drop-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <h2>Drop a Game Clip</h2>
                    <p>Drag & drop an .mp4 video or <button id="browse-btn" class="browse-link">browse files</button></p>
                    <input type="file" id="file-input" accept="video/mp4,video/*" hidden>
                    <div class="supported-formats">MP4 · MOV · AVI · MKV</div>
                </div>
                <div class="drop-zone-border"></div>
            </div>

            <!-- Video Canvas (shown during processing) -->
            <div id="video-container" class="video-container hidden">
                <canvas id="video-canvas"></canvas>
                <div id="video-overlay" class="video-overlay">
                    <div class="overlay-badge" id="overlay-mode">ANALYZING</div>
                </div>
                <!-- Progress bar -->
                <div id="progress-bar" class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </section>

        <!-- Alerts Sidebar -->
        <aside id="alerts-panel">
            <div class="panel-header">
                <h2>🏀 Referee Alerts</h2>
                <button id="clear-alerts" class="btn-icon" title="Clear alerts">✕</button>
            </div>
            <div id="alerts-list" class="alerts-list">
                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <p>No alerts yet</p>
                    <span>Upload a game clip to start analysis</span>
                </div>
            </div>
        </aside>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
